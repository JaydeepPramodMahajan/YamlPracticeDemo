name: "By my self"
on:
  push:
    branches:
      - main 
      - master
  pull_request:
    branches:
      - master
      - test
    types:
      - opened
      - closed

jobs:
  on_push:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
        - name: "printing on desk"
          run: echo "Push"

  on_pull:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: "pull demo"
        run: echo "Pull"
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: "Github-action-demo"
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Finding python"
        run: where python

      



